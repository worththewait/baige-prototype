<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页 · 百舸数智平台</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="module-page" data-page="home">
  <main class="module-main">
    <div class="content-scroll" id="contentScroll">
      <div class="content-inner home-page" id="content">
<section id="conversationView">
      <div class="page-header">
        <div><h1>你好，这里是百舸</h1>
        <p>从一个问题、一份资料，开始今天的研究与创作。</p></div>
      </div>
      <div class="home-workspace">
        <section class="conversation" aria-labelledby="conversationTitle">
          <h2 id="conversationTitle">今天想研究什么？</h2>
          <form id="conversationForm" class="composer">
            <label class="sr-only" for="homePrompt">对话内容</label>
            <textarea id="homePrompt" placeholder="输入问题，或描述你需要完成的工作…" rows="4"></textarea>
            <div class="composer-bottom"><span><span data-icon="chat" aria-hidden="true"></span>对话</span>
            <button class="primary-button" type="submit">发送<span data-icon="arrow" aria-hidden="true"></span></button></div>
          </form>
          <p class="form-feedback" id="conversationFeedback" role="status"></p>
        </section>
        <section class="research-links" aria-labelledby="researchTitle">
          <h2 id="researchTitle">研究与探索</h2>
          <button class="research-link" data-route="frontier" data-child="全球鹰"><span data-icon="globe" aria-hidden="true"></span><span>全球鹰<small>前沿工具</small></span><span data-icon="arrow" aria-hidden="true"></span></button>
          <button class="research-link" data-route="frontier" data-child="智研通"><span data-icon="compass" aria-hidden="true"></span><span>智研通<small>前沿工具</small></span><span data-icon="arrow" aria-hidden="true"></span></button>
          <button class="research-link" data-shortcut="smart-tools"><span data-icon="grid" aria-hidden="true"></span><span>智能工具<small>文档、写作与研究辅助</small></span><span data-icon="arrow" aria-hidden="true"></span></button>
        </section>
      </div>
      <section class="home-section" aria-labelledby="workflowTitle">
        <div class="section-heading"><h2 id="workflowTitle">从工作场景出发</h2><span>选择你的下一步</span></div>
        <div class="workflow-list">
          <button data-shortcut="knowledge" class="workflow-entry"><span data-icon="book" aria-hidden="true"></span><h3>查阅知识</h3><p>连接部门、行业、个人与企业知识。</p><span>打开知识库<span data-icon="arrow" aria-hidden="true"></span></span></button>
          <button data-shortcut="writing" class="workflow-entry"><span data-icon="pen" aria-hidden="true"></span><h3>组织表达</h3><p>从主题和框架出发，完成专业内容。</p><span>进入百舸写作<span data-icon="arrow" aria-hidden="true"></span></span></button>
          <button data-shortcut="smart-tools" class="workflow-entry"><span data-icon="layers" aria-hidden="true"></span><h3>处理资料</h3><p>翻译、识别、校对，找到适合的工具。</p><span>浏览智能工具<span data-icon="arrow" aria-hidden="true"></span></span></button>
        </div>
      </section>
</section>
      </div>
    </div>
  </main>
  <script src="../src/data.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/page-bridge.js"></script>
  <script src="../src/pages/home.js"></script>
</body>
</html>
