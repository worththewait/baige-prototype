<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库 · 百舸数智平台</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../workspace.css" />
</head>
<body class="module-page" data-page="knowledge">
  <main class="module-main">
    <div class="content-scroll" id="contentScroll">
      <div class="content-inner knowledge-page" id="content">
<div class="page-header"><div><h1>知识库</h1><p>把散落的资料，汇成可以查阅的知识。</p></div></div>
<label class="center-search knowledge-page-search"><span data-icon="search" aria-hidden="true"></span><span class="sr-only">搜索知识库</span><input id="knowledgeLibrarySearch" type="search" placeholder="搜索知识库名称" /></label>
<div id="knowledgeScopes" class="category-tabs" role="group" aria-label="知识库范围"></div>
<section class="knowledge-panel">
  <div class="section-heading"><h2 id="knowledgeTitle">全部知识库</h2><span id="knowledgeLibraryCount"></span></div>
  <div class="knowledge-resource-grid" id="knowledgeResources"></div>
  <p class="knowledge-prototype-note">以下知识库为原型示例，实际知识内容正在集成。</p>
</section>
      </div>
    </div>
  </main>
  <script src="../src/data.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/page-bridge.js"></script>
  <script src="../src/pages/knowledge.js"></script>
</body>
</html>
